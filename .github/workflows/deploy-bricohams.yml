name: Deploy to bricohams.org and bricohams.com

# On every push to main that touches the app: test, build the public web and upload it to both
# WordPress sites of the hosting account (see docs/WORDPRESS.md):
#   https://bricohams.org/radio-examenes/             ← htdocs/radio-examenes
#   https://bricohams.com/wp-content/radio-examenes/  ← bricohams.com/htdocs/wp-content/radio-examenes
# Credentials live only in repository secrets (Settings → Secrets and variables → Actions):
#   BRICOHAMS_FTP_HOST, BRICOHAMS_FTP_USER, BRICOHAMS_FTP_PASSWORD
#   BRICOHAMS_FTP_PROTOCOL     sftp or ftps (default ftps)
#   BRICOHAMS_SSH_KNOWN_HOSTS  sftp only: `ssh-keyscan HOST`, checked against the hosting panel
# Without them the deploy is skipped with a warning. Each upload stops unless its WordPress root holds
# wp-includes/, writes only inside the app folder, deletes nothing, and sends index.html last so it never
# points at missing assets. Afterwards the live index.html must match the build.

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/deploy-bricohams.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bricohams-radio-examenes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SRC: dist
      # WordPress root | folder inside it | public URL of that folder
      TARGETS: |
        htdocs|radio-examenes|https://bricohams.org/radio-examenes
        bricohams.com/htdocs|wp-content/radio-examenes|https://bricohams.com/wp-content/radio-examenes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:public
      - name: Upload and check each site
        env:
          FTP_HOST: ${{ secrets.BRICOHAMS_FTP_HOST }}
          FTP_USER: ${{ secrets.BRICOHAMS_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.BRICOHAMS_FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.BRICOHAMS_FTP_PROTOCOL }}
          KNOWN_HOSTS: ${{ secrets.BRICOHAMS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Deploy skipped: add the BRICOHAMS_FTP_* repository secrets to publish on bricohams.org/.com"
            exit 0
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          case "${FTP_PROTOCOL:-ftps}" in
            ftps) URL="ftp://$FTP_HOST"
                  OPTS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;" ;;
            sftp) [ -n "$KNOWN_HOSTS" ] || { echo "::error::sftp needs BRICOHAMS_SSH_KNOWN_HOSTS"; exit 1; }
                  mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  URL="sftp://$FTP_HOST"
                  OPTS="set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes';" ;;
            *) echo "::error::BRICOHAMS_FTP_PROTOCOL must be ftps or sftp"; exit 1 ;;
          esac
          want=$(sha256sum "$SRC/index.html" | cut -d' ' -f1)
          while IFS='|' read -r root dir live; do
            [ -n "$root" ] || continue
            echo "::group::$live"
            lftp -c "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30; $OPTS
              open --env-password -u '$FTP_USER' '$URL';
              cls -d '$root/wp-includes';
              mkdir -pf '$root/$dir';
              mirror --reverse --verbose --no-perms --exclude-glob index.html '$SRC' '$root/$dir';
              put '$SRC/index.html' -o '$root/$dir/index.html'"
            ok=no
            for i in 1 2 3 4 5; do
              got=$(curl -fsS "$live/index.html?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1) || true
              [ "$got" = "$want" ] && { ok=yes; break; }
              sleep 10
            done
            echo "::endgroup::"
            [ "$ok" = yes ] || { echo "::error::$live/index.html does not match the build (cache?)"; exit 1; }
            echo "Live $live/ matches $GITHUB_SHA"
          done <<< "$TARGETS"
