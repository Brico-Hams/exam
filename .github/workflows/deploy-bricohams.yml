name: Deploy to bricohams.org and bricohams.com

# On every push to main that touches the app: test, build the public web and upload it to both
# WordPress sites of the 1984 Hosting account over SFTP (see docs/WORDPRESS.md):
#   https://bricohams.org/radio-examenes/             ← htdocs/radio-examenes
#   https://bricohams.com/wp-content/radio-examenes/  ← bricohams.com/htdocs/wp-content/radio-examenes
# Credentials live only in repository secrets (Settings → Secrets and variables → Actions):
#   BRICOHAMS_SFTP_USER, BRICOHAMS_SFTP_PASSWORD
# Without them the deploy is skipped with a warning. The server's public host key is pinned below, so a
# different server is refused. Each upload stops unless its WordPress root holds wp-includes/, writes only
# inside the app folder, deletes nothing, and sends index.html last so it never points at missing assets.
# Afterwards the live index.html must match the build.

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/deploy-bricohams.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bricohams-radio-examenes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SRC: dist
      SFTP_HOST: ernie.shared.1984.is
      SFTP_PORT: '2222'
      # ssh-keyscan -p 2222 ernie.shared.1984.is (RSA SHA256:dOwYtoYzRLbe1khWJIRME3JuJj84I8G2ZdEnKvyXXco)
      SFTP_KNOWN_HOST: '[ernie.shared.1984.is]:2222 ssh-rsa '
      # WordPress root | folder inside it | public URL of that folder
      TARGETS: |
        htdocs|radio-examenes|https://bricohams.org/radio-examenes
        bricohams.com/htdocs|wp-content/radio-examenes|https://bricohams.com/wp-content/radio-examenes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:public
      - name: Upload and check each site
        env:
          SFTP_USER: ${{ secrets.BRICOHAMS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.BRICOHAMS_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Deploy skipped: add the BRICOHAMS_SFTP_USER and BRICOHAMS_SFTP_PASSWORD repository secrets"
            exit 0
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p ~/.ssh && printf '%s\n' "$SFTP_KNOWN_HOST" > ~/.ssh/known_hosts
          want=$(sha256sum "$SRC/index.html" | cut -d' ' -f1)
          while IFS='|' read -r root dir live; do
            [ -n "$root" ] || continue
            echo "::group::$live"
            lftp -c "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30;
              set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes';
              open --env-password -u '$SFTP_USER' 'sftp://$SFTP_HOST:$SFTP_PORT';
              cls -d '$root/wp-includes';
              mkdir -pf '$root/$dir';
              mirror --reverse --verbose --no-perms --exclude-glob index.html '$SRC' '$root/$dir';
              put '$SRC/index.html' -o '$root/$dir/index.html'"
            ok=no
            for i in 1 2 3 4 5; do
              got=$(curl -fsS "$live/index.html?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1) || true
              [ "$got" = "$want" ] && { ok=yes; break; }
              sleep 10
            done
            echo "::endgroup::"
            [ "$ok" = yes ] || { echo "::error::$live/index.html does not match the build (cache?)"; exit 1; }
            echo "Live $live/ matches $GITHUB_SHA"
          done <<< "$TARGETS"
